<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-label="Visão geral dos casos de uso divididos em cinco módulos">
<rect width="1400" height="850" fill="#ffffff"/>
<text x="700" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173b53">Sistema de Controle de Estoque para Lojas de Roupas</text>
<text x="700" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#52636f">Diagrama completo organizado em cinco visões funcionais · 15 casos de uso · 5 atores diretos</text>
<g font-family="Arial,sans-serif">
<rect x="130" y="140" width="1140" height="112" rx="18" fill="#f1f7fb" stroke="#245b78" stroke-width="2"/><circle cx="195" cy="196" r="30" fill="#28668a"/><text x="195" y="203" fill="#fff" font-size="19" text-anchor="middle" font-weight="bold">01</text><text x="255" y="185" fill="#173b53" font-size="23" font-weight="bold">Cadastro e abertura</text><text x="255" y="219" fill="#52636f" font-size="17">UC01 Cadastro de produtos · UC02 Locais físicos · UC03 Estoque inicial</text>
<rect x="130" y="278" width="1140" height="112" rx="18" fill="#f2f8f6" stroke="#245b78" stroke-width="2"/><circle cx="195" cy="334" r="30" fill="#2b8a72"/><text x="195" y="341" fill="#fff" font-size="19" text-anchor="middle" font-weight="bold">02</text><text x="255" y="323" fill="#173b53" font-size="23" font-weight="bold">Consulta e atendimento</text><text x="255" y="357" fill="#52636f" font-size="17">UC04 Disponibilidade · UC05 Localização · UC06 Venda ou saída</text>
<rect x="130" y="416" width="1140" height="112" rx="18" fill="#fbf7ef" stroke="#245b78" stroke-width="2"/><circle cx="195" cy="472" r="30" fill="#bc822a"/><text x="195" y="479" fill="#fff" font-size="19" text-anchor="middle" font-weight="bold">03</text><text x="255" y="461" fill="#173b53" font-size="23" font-weight="bold">Movimentações e alertas</text><text x="255" y="495" fill="#52636f" font-size="17">UC07 Entrada/reposição · UC08 Transferência · UC09 Alerta de estoque crítico</text>
<rect x="130" y="554" width="1140" height="112" rx="18" fill="#f7f4fb" stroke="#245b78" stroke-width="2"/><circle cx="195" cy="610" r="30" fill="#7a5ca5"/><text x="195" y="617" fill="#fff" font-size="19" text-anchor="middle" font-weight="bold">04</text><text x="255" y="599" fill="#173b53" font-size="23" font-weight="bold">Fechamento e acurácia</text><text x="255" y="633" fill="#52636f" font-size="17">UC10 Contagem física · UC11 Fechamento · UC14 Comparação · UC15 Score</text>
<rect x="130" y="692" width="1140" height="112" rx="18" fill="#fbf3f5" stroke="#245b78" stroke-width="2"/><circle cx="195" cy="748" r="30" fill="#b05a70"/><text x="195" y="755" fill="#fff" font-size="19" text-anchor="middle" font-weight="bold">05</text><text x="255" y="737" fill="#173b53" font-size="23" font-weight="bold">Relatórios e histórico</text><text x="255" y="771" fill="#52636f" font-size="17">UC12 Relatórios e Score de Acurácia · UC13 Histórico de movimentações</text>
